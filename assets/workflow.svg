<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" width="1120" height="250" role="img" aria-label="My evaluation loop: predict, freeze, run once, score, publish. Example: Tashwish scored 28 predictions with 19 hits, 8 misses and 1 not evaluable.">
  <defs>
    <circle id="pulse" r="7"/>
  </defs>
  <style>
    .sans { font-family: 'Space Grotesk','IBM Plex Sans','Segoe UI',Arial,sans-serif; }
    .mono { font-family: 'IBM Plex Mono','SFMono-Regular',Consolas,'Courier New',monospace; }
    .sh, .sm, .sn { width: 20px; height: 20px; rx: 6px; }
    .sh { fill: #d9728f; }
    .sm { fill: #fffaf7; stroke: #d9728f; stroke-width: 2; stroke-dasharray: 3 3; }
    .sn { fill: #fbd5de; stroke: #a8788a; stroke-width: 1.5; }
    .flow { animation: flow 2.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -18; } }
    .pop { animation: pop 12s cubic-bezier(.3,1.4,.5,1) infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pop { 0% { transform: scale(0); opacity: 0; } 4% { transform: scale(1); opacity: 1; } 88% { transform: scale(1); opacity: 1; } 96%, 100% { transform: scale(0.6); opacity: 0; } }
  </style>
  <rect x="2" y="2" width="1116" height="246" rx="22" fill="#fff3f6" stroke="#f7b6c8" stroke-width="2"/>
  <g><line class="flow" x1="210" y1="74" x2="244" y2="74" stroke="#d9728f" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/><path d="M241,68 L250,74 L241,80" fill="none" stroke="#d9728f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="flow" x1="430" y1="74" x2="464" y2="74" stroke="#d9728f" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/><path d="M461,68 L470,74 L461,80" fill="none" stroke="#d9728f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="flow" x1="650" y1="74" x2="684" y2="74" stroke="#d9728f" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/><path d="M681,68 L690,74 L681,80" fill="none" stroke="#d9728f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line class="flow" x1="870" y1="74" x2="904" y2="74" stroke="#d9728f" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/><path d="M901,68 L910,74 L901,80" fill="none" stroke="#d9728f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g><g transform="translate(35 36)"><rect width="170" height="76" rx="18" fill="#fffaf7" stroke="#f7b6c8" stroke-width="2"><animate attributeName="fill" values="#fffaf7;#fffaf7;#fbd5de;#fffaf7;#fffaf7" keyTimes="0.0000;0.0500;0.1000;0.2200;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="stroke" values="#f7b6c8;#f7b6c8;#d9728f;#f7b6c8;#f7b6c8" keyTimes="0.0000;0.0500;0.1000;0.2200;1.0000" dur="12s" repeatCount="indefinite"/></rect><circle cx="22" cy="24" r="10" fill="#d9728f"/><text class="sans" x="22" y="29" font-size="13" font-weight="700" text-anchor="middle" fill="#fffaf7">1</text><text class="sans" x="42" y="30" font-size="19" font-weight="700" fill="#5b3a4a">Predict</text><text class="sans" x="85" y="58" font-size="12" text-anchor="middle" fill="#a8788a">hypotheses committed first</text></g><g transform="translate(255 36)"><rect width="170" height="76" rx="18" fill="#fffaf7" stroke="#f7b6c8" stroke-width="2"><animate attributeName="fill" values="#fffaf7;#fffaf7;#fbd5de;#fffaf7;#fffaf7" keyTimes="0.0000;0.2050;0.2550;0.3750;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="stroke" values="#f7b6c8;#f7b6c8;#d9728f;#f7b6c8;#f7b6c8" keyTimes="0.0000;0.2050;0.2550;0.3750;1.0000" dur="12s" repeatCount="indefinite"/></rect><circle cx="22" cy="24" r="10" fill="#d9728f"/><text class="sans" x="22" y="29" font-size="13" font-weight="700" text-anchor="middle" fill="#fffaf7">2</text><text class="sans" x="42" y="30" font-size="19" font-weight="700" fill="#5b3a4a">Freeze</text><text class="sans" x="85" y="58" font-size="12" text-anchor="middle" fill="#a8788a">split, model and threshold</text></g><g transform="translate(475 36)"><rect width="170" height="76" rx="18" fill="#fffaf7" stroke="#f7b6c8" stroke-width="2"><animate attributeName="fill" values="#fffaf7;#fffaf7;#fbd5de;#fffaf7;#fffaf7" keyTimes="0.0000;0.3600;0.4100;0.5300;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="stroke" values="#f7b6c8;#f7b6c8;#d9728f;#f7b6c8;#f7b6c8" keyTimes="0.0000;0.3600;0.4100;0.5300;1.0000" dur="12s" repeatCount="indefinite"/></rect><circle cx="22" cy="24" r="10" fill="#d9728f"/><text class="sans" x="22" y="29" font-size="13" font-weight="700" text-anchor="middle" fill="#fffaf7">3</text><text class="sans" x="42" y="30" font-size="19" font-weight="700" fill="#5b3a4a">Run once</text><text class="sans" x="85" y="58" font-size="12" text-anchor="middle" fill="#a8788a">test data read one time</text></g><g transform="translate(695 36)"><rect width="170" height="76" rx="18" fill="#fffaf7" stroke="#f7b6c8" stroke-width="2"><animate attributeName="fill" values="#fffaf7;#fffaf7;#fbd5de;#fffaf7;#fffaf7" keyTimes="0.0000;0.5150;0.5650;0.6850;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="stroke" values="#f7b6c8;#f7b6c8;#d9728f;#f7b6c8;#f7b6c8" keyTimes="0.0000;0.5150;0.5650;0.6850;1.0000" dur="12s" repeatCount="indefinite"/></rect><circle cx="22" cy="24" r="10" fill="#d9728f"/><text class="sans" x="22" y="29" font-size="13" font-weight="700" text-anchor="middle" fill="#fffaf7">4</text><text class="sans" x="42" y="30" font-size="19" font-weight="700" fill="#5b3a4a">Score</text><text class="sans" x="85" y="58" font-size="12" text-anchor="middle" fill="#a8788a">every prediction hit or miss</text></g><g transform="translate(915 36)"><rect width="170" height="76" rx="18" fill="#fffaf7" stroke="#f7b6c8" stroke-width="2"><animate attributeName="fill" values="#fffaf7;#fffaf7;#fbd5de;#fffaf7;#fffaf7" keyTimes="0.0000;0.6700;0.7200;0.8400;1.0000" dur="12s" repeatCount="indefinite"/><animate attributeName="stroke" values="#f7b6c8;#f7b6c8;#d9728f;#f7b6c8;#f7b6c8" keyTimes="0.0000;0.6700;0.7200;0.8400;1.0000" dur="12s" repeatCount="indefinite"/></rect><circle cx="22" cy="24" r="10" fill="#d9728f"/><text class="sans" x="22" y="29" font-size="13" font-weight="700" text-anchor="middle" fill="#fffaf7">5</text><text class="sans" x="42" y="30" font-size="19" font-weight="700" fill="#5b3a4a">Publish</text><text class="sans" x="85" y="58" font-size="12" text-anchor="middle" fill="#a8788a">misses stay in the table</text></g></g>
  <!-- the pulse that walks through the five steps -->
  <g>
    <circle r="15" fill="#f7b6c8" opacity="0.55">
      <animateMotion dur="12s" repeatCount="indefinite" path="M120,74 L1000,74" keyPoints="0;0;1;1" keyTimes="0;0.10;0.72;1" calcMode="linear"/>
    </circle>
    <circle r="6.5" fill="#d9728f">
      <animateMotion dur="12s" repeatCount="indefinite" path="M120,74 L1000,74" keyPoints="0;0;1;1" keyTimes="0;0.10;0.72;1" calcMode="linear"/>
    </circle>
  </g>

  <text class="mono" x="120" y="156" font-size="14" fill="#a8788a" letter-spacing="1">EXAMPLE: TASHWISH, 28 SCORED PREDICTIONS</text>
  <g class="pop" style="animation-delay:0.00s"><rect class="sh" x="120" y="180"/></g><g class="pop" style="animation-delay:0.06s"><rect class="sh" x="146" y="180"/></g><g class="pop" style="animation-delay:0.12s"><rect class="sh" x="172" y="180"/></g><g class="pop" style="animation-delay:0.18s"><rect class="sh" x="198" y="180"/></g><g class="pop" style="animation-delay:0.24s"><rect class="sh" x="224" y="180"/></g><g class="pop" style="animation-delay:0.30s"><rect class="sh" x="250" y="180"/></g><g class="pop" style="animation-delay:0.36s"><rect class="sh" x="276" y="180"/></g><g class="pop" style="animation-delay:0.42s"><rect class="sh" x="302" y="180"/></g><g class="pop" style="animation-delay:0.48s"><rect class="sh" x="328" y="180"/></g><g class="pop" style="animation-delay:0.54s"><rect class="sh" x="354" y="180"/></g><g class="pop" style="animation-delay:0.60s"><rect class="sh" x="380" y="180"/></g><g class="pop" style="animation-delay:0.66s"><rect class="sh" x="406" y="180"/></g><g class="pop" style="animation-delay:0.72s"><rect class="sh" x="432" y="180"/></g><g class="pop" style="animation-delay:0.78s"><rect class="sh" x="458" y="180"/></g><g class="pop" style="animation-delay:0.84s"><rect class="sh" x="484" y="180"/></g><g class="pop" style="animation-delay:0.90s"><rect class="sh" x="510" y="180"/></g><g class="pop" style="animation-delay:0.96s"><rect class="sh" x="536" y="180"/></g><g class="pop" style="animation-delay:1.02s"><rect class="sh" x="562" y="180"/></g><g class="pop" style="animation-delay:1.08s"><rect class="sh" x="588" y="180"/></g><g class="pop" style="animation-delay:1.14s"><rect class="sm" x="614" y="180"/></g><g class="pop" style="animation-delay:1.20s"><rect class="sm" x="640" y="180"/></g><g class="pop" style="animation-delay:1.26s"><rect class="sm" x="666" y="180"/></g><g class="pop" style="animation-delay:1.32s"><rect class="sm" x="692" y="180"/></g><g class="pop" style="animation-delay:1.38s"><rect class="sm" x="718" y="180"/></g><g class="pop" style="animation-delay:1.44s"><rect class="sm" x="744" y="180"/></g><g class="pop" style="animation-delay:1.50s"><rect class="sm" x="770" y="180"/></g><g class="pop" style="animation-delay:1.56s"><rect class="sm" x="796" y="180"/></g><g class="pop" style="animation-delay:1.62s"><rect class="sn" x="822" y="180"/></g>
  <g class="mono" font-size="13" fill="#5b3a4a">
    <rect x="860" y="167" width="14" height="14" rx="4" fill="#d9728f"/><text x="882" y="179">19 hit</text>
    <rect x="860" y="187" width="14" height="14" rx="4" fill="#fffaf7" stroke="#d9728f" stroke-width="1.5" stroke-dasharray="2 2"/><text x="882" y="199">8 miss</text>
    <rect x="860" y="207" width="14" height="14" rx="4" fill="#fbd5de" stroke="#a8788a" stroke-width="1.2"/><text x="882" y="219">1 not evaluable</text>
  </g>
</svg>
