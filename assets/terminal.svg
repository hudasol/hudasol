<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280" role="img" aria-label="A small terminal card: focus is calibrated AI for infrastructure and autonomy; region is the United Arab Emirates; habit is writing predictions before results; promise is that real, synthetic and proposed work stay labelled.">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbd5de"/><stop offset="1" stop-color="#fbe3ea"/></linearGradient>
    <clipPath id="t0"><rect x="60" y="76" width="0" height="34"><animate attributeName="width" values="0;0;400;400;0;0" keyTimes="0.0000;0.0300;0.1100;0.9000;0.9400;1.0000" dur="16s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="t1"><rect x="60" y="102" width="0" height="32"><animate attributeName="width" values="0;0;860;860;0;0" keyTimes="0.0000;0.1400;0.2400;0.9000;0.9400;1.0000" dur="16s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="t2"><rect x="60" y="134" width="0" height="32"><animate attributeName="width" values="0;0;860;860;0;0" keyTimes="0.0000;0.2700;0.3700;0.9000;0.9400;1.0000" dur="16s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="t3"><rect x="60" y="166" width="0" height="32"><animate attributeName="width" values="0;0;860;860;0;0" keyTimes="0.0000;0.4000;0.5000;0.9000;0.9400;1.0000" dur="16s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="t4"><rect x="60" y="198" width="0" height="32"><animate attributeName="width" values="0;0;860;860;0;0" keyTimes="0.0000;0.5300;0.6300;0.9000;0.9400;1.0000" dur="16s" repeatCount="indefinite"/></rect></clipPath>

  </defs>
  <style>
    .mono { font-family: 'IBM Plex Mono','SFMono-Regular',Consolas,'Courier New',monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .dot { animation: dot 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes dot { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    .glow { animation: glow 5s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }
  </style>
  <rect x="20" y="20" width="920" height="240" rx="16" fill="#f7b6c8" opacity="0.55" transform="translate(8 8)"/>
  <rect x="20" y="20" width="920" height="240" rx="16" fill="#fffaf7" stroke="#d9728f" stroke-width="2"/>
  <path d="M20,36 a16,16 0 0 1 16,-16 h888 a16,16 0 0 1 16,16 v22 h-920 z" fill="url(#bar)"/>
  <line x1="20" y1="58" x2="940" y2="58" stroke="#d9728f" stroke-opacity="0.35"/>
  <circle class="dot" cx="48" cy="39" r="6" fill="#d9728f"/>
  <circle class="dot" cx="70" cy="39" r="6" fill="#f7b6c8" style="animation-delay:-1s"/>
  <circle class="dot" cx="92" cy="39" r="6" fill="#fbd5de" stroke="#d9728f" stroke-width="1" style="animation-delay:-2s"/>
  <text class="mono" x="480" y="44" font-size="13" fill="#a8788a" text-anchor="middle">~/hudasol</text>
  <rect class="glow" x="24" y="62" width="4" height="190" fill="#d9728f" opacity="0.4"/>
  <g clip-path="url(#t0)"><text class="mono" x="64" y="98" font-size="16" fill="#5b3a4a"><tspan fill="#d9728f">$</tspan> hudasol --about</text></g>
<g clip-path="url(#t1)"><text class="mono" y="124" font-size="16"><tspan x="64" fill="#d9728f">focus</tspan><tspan x="196" fill="#5b3a4a">calibrated AI for infrastructure and autonomy</tspan></text></g>
<g clip-path="url(#t2)"><text class="mono" y="156" font-size="16"><tspan x="64" fill="#d9728f">region</tspan><tspan x="196" fill="#5b3a4a">United Arab Emirates (Dubai and Abu Dhabi)</tspan></text></g>
<g clip-path="url(#t3)"><text class="mono" y="188" font-size="16"><tspan x="64" fill="#d9728f">habit</tspan><tspan x="196" fill="#5b3a4a">predictions are written before results</tspan></text></g>
<g clip-path="url(#t4)"><text class="mono" y="220" font-size="16"><tspan x="64" fill="#d9728f">promise</tspan><tspan x="196" fill="#5b3a4a">real, synthetic and proposed work stay labelled</tspan></text></g>

  <text class="mono" x="64" y="252" font-size="16" fill="#5b3a4a"><tspan fill="#d9728f">$</tspan> <tspan class="blink" fill="#d9728f">_</tspan></text>
</svg>
