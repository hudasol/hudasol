    .dt { fill: #d9728f; }
    .tx { font-size: 15px; text-anchor: middle; fill: #5b3a4a; }
    .r1 { animation: m1 40s linear infinite; }
    .r2 { animation: m2 50s linear infinite; }
    @keyframes m1 { from { transform: translateX(0); } to { transform: translateX(-1821px); } }
    @keyframes m2 { from { transform: translateX(-2304px); } to { transform: translateX(0); } }
