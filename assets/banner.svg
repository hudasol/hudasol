<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Huda Mueen. Calibrated AI for infrastructure and autonomy.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8f5"/>
      <stop offset="1" stop-color="#fbe3ea"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="680" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#5b3a4a"/>
      <stop offset="0.42" stop-color="#5b3a4a"/>
      <stop offset="0.5" stop-color="#d9728f"/>
      <stop offset="0.58" stop-color="#5b3a4a"/>
      <stop offset="1" stop-color="#5b3a4a"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#f7b6c8" stop-opacity="0.55"/><stop offset="1" stop-color="#f7b6c8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#fbd5de" stop-opacity="0.9"/><stop offset="1" stop-color="#fbd5de" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#f7b6c8"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="22 22" dur="9s" repeatCount="indefinite"/>
    </pattern>
    <g id="blossom"><g fill="#fbd5de" stroke="#d9728f" stroke-width="1"><ellipse cx="0" cy="-12" rx="8" ry="12" transform="rotate(0)"/><ellipse cx="0" cy="-12" rx="8" ry="12" transform="rotate(72)"/><ellipse cx="0" cy="-12" rx="8" ry="12" transform="rotate(144)"/><ellipse cx="0" cy="-12" rx="8" ry="12" transform="rotate(216)"/><ellipse cx="0" cy="-12" rx="8" ry="12" transform="rotate(288)"/></g><circle r="4" fill="#d9728f"/></g>
    <path id="spark" d="M0,-8 L1.8,-1.8 L8,0 L1.8,1.8 L0,8 L-1.8,1.8 L-8,0 L-1.8,-1.8 Z"/>
    <clipPath id="card"><rect x="40" y="40" width="1100" height="236" rx="18"/></clipPath>
    <clipPath id="typed0"><rect x="80" y="188" width="0" height="40"><animate attributeName="width" values="0;640;640;0;0" keyTimes="0.0000;0.0500;0.2700;0.3100;1.0000" dur="18s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="typed1"><rect x="80" y="188" width="0" height="40"><animate attributeName="width" values="0;0;640;640;0;0" keyTimes="0.0000;0.3333;0.3833;0.6033;0.6433;1.0000" dur="18s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="typed2"><rect x="80" y="188" width="0" height="40"><animate attributeName="width" values="0;0;640;640;0;0" keyTimes="0.0000;0.6667;0.7167;0.9367;0.9767;1.0000" dur="18s" repeatCount="indefinite"/></rect></clipPath>

  </defs>

  <style>
    .mono { font-family: 'IBM Plex Mono','SFMono-Regular',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Space Grotesk','IBM Plex Sans','Segoe UI',Arial,sans-serif; }
    .draw { animation: draw 6s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dasharray: 520; stroke-dashoffset: 520; } 55%, 85% { stroke-dasharray: 520; stroke-dashoffset: 0; } 100% { stroke-dasharray: 520; stroke-dashoffset: -520; } }
    .band { animation: breathe 6s ease-in-out infinite; transform-origin: 936px 150px; }
    @keyframes breathe { 0%, 100% { transform: scaleY(0.55); opacity: 0.25; } 55% { transform: scaleY(1.1); opacity: 0.45; } }
    .pt { animation: pt 6s ease-in-out infinite; }
    @keyframes pt { 0%, 8% { opacity: 0; } 20%, 85% { opacity: 1; } 100% { opacity: 0; } }
    .fall1 { animation: fall 9s linear infinite; }
    .fall2 { animation: fall 12s linear infinite; animation-delay: -4s; }
    .fall3 { animation: fall 10s linear infinite; animation-delay: -7s; }
    .fall4 { animation: fall 14s linear infinite; animation-delay: -2s; }
    .fall5 { animation: fall2 11s linear infinite; animation-delay: -5s; }
    .fall6 { animation: fall2 15s linear infinite; animation-delay: -9s; }
    .fall7 { animation: fall 13s linear infinite; animation-delay: -11s; }
    @keyframes fall {
      0%   { transform: translate(0, -40px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.9; }
      50%  { transform: translate(-40px, 120px) rotate(160deg); }
      90%  { opacity: 0.9; }
      100% { transform: translate(10px, 300px) rotate(340deg); opacity: 0; }
    }
    @keyframes fall2 {
      0%   { transform: translate(0, -40px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.8; }
      35%  { transform: translate(34px, 70px) rotate(90deg); }
      65%  { transform: translate(-26px, 170px) rotate(210deg); }
      90%  { opacity: 0.8; }
      100% { transform: translate(24px, 300px) rotate(360deg); opacity: 0; }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .sway { animation: sway 5s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    .spin { animation: spin 40s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .driftA { animation: driftA 16s ease-in-out infinite alternate; }
    .driftB { animation: driftB 19s ease-in-out infinite alternate; }
    @keyframes driftA { from { transform: translate(0, 0); } to { transform: translate(120px, 30px); } }
    @keyframes driftB { from { transform: translate(0, 0); } to { transform: translate(-140px, -26px); } }
    .twinkle { animation: twinkle 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes twinkle { 0%, 100% { transform: scale(0.2); opacity: 0.1; } 50% { transform: scale(1); opacity: 1; } }
    .rise { animation: rise 1.4s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 0.35; } 55% { transform: translateX(352px); opacity: 0.35; } 60%, 100% { transform: translateX(352px); opacity: 0; } }
    .glowpulse { animation: glowpulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes glowpulse { 0%, 100% { transform: scale(0.8); opacity: 0.35; } 50% { transform: scale(1.5); opacity: 0.6; } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <rect x="52" y="52" width="1100" height="236" rx="18" fill="#f7b6c8"/>
  <rect x="40" y="40" width="1100" height="236" rx="18" fill="#fffaf7" stroke="#d9728f" stroke-width="2"/>

  <g clip-path="url(#card)">
    <!-- living background: drifting glows, a moving dot grid and a slow spinning blossom -->
    <g class="driftA"><circle cx="260" cy="110" r="190" fill="url(#glowA)"/></g>
    <g class="driftB"><circle cx="980" cy="230" r="210" fill="url(#glowB)"/></g>
    <rect x="40" y="40" width="1100" height="236" fill="url(#dots)" opacity="0.45"/>
    <g transform="translate(1118 262)" opacity="0.09"><g class="spin"><use href="#blossom" transform="scale(4.6)"/></g></g>

    <!-- falling petals at different depths -->
    <g transform="translate(700 20)"><g class="fall1"><use href="#blossom" transform="scale(0.5)"/></g></g>
    <g transform="translate(880 20)"><g class="fall2"><use href="#blossom" transform="scale(0.4)"/></g></g>
    <g transform="translate(1040 20)"><g class="fall3"><use href="#blossom" transform="scale(0.55)"/></g></g>
    <g transform="translate(600 20)"><g class="fall4"><ellipse rx="6" ry="3.5" fill="#f7b6c8"/></g></g>
    <g transform="translate(760 20)"><g class="fall5"><ellipse rx="5" ry="3" fill="#fbd5de" stroke="#d9728f" stroke-width="0.8"/></g></g>
    <g transform="translate(960 20)"><g class="fall6"><ellipse rx="7" ry="4" fill="#f7b6c8"/></g></g>
    <g transform="translate(500 20)"><g class="fall7"><use href="#blossom" transform="scale(0.32)"/></g></g>

    <!-- sparkles -->
    <g transform="translate(676 98)"><use href="#spark" class="twinkle" fill="#d9728f"/></g>
    <g transform="translate(722 70)"><use href="#spark" class="twinkle" fill="#f7b6c8" style="animation-delay:-1.1s" transform="scale(0.8)"/></g>
    <g transform="translate(700 232)"><use href="#spark" class="twinkle" fill="#d9728f" style="animation-delay:-2s" transform="scale(0.7)"/></g>
    <g transform="translate(1126 236)"><use href="#spark" class="twinkle" fill="#f7b6c8" style="animation-delay:-0.6s"/></g>
    <g transform="translate(60 258)"><use href="#spark" class="twinkle" fill="#f7b6c8" style="animation-delay:-1.7s" transform="scale(0.8)"/></g>
  </g>

  <g transform="translate(1085 78) scale(1.1)"><g class="sway"><use href="#blossom"/></g></g>

  <!-- text -->
  <text class="mono" x="80" y="88" font-size="16" fill="#d9728f" letter-spacing="2">hudasol<tspan class="cursor">_</tspan></text>
  <g class="rise"><text class="sans" x="80" y="172" font-size="84" font-weight="700" fill="url(#ink)" letter-spacing="-2">HUDA MUEEN</text></g>
  <g clip-path="url(#typed0)"><text class="sans" x="80" y="214" font-size="26" fill="#5b3a4a">Calibrated AI for infrastructure and autonomy.</text></g>
<g clip-path="url(#typed1)"><text class="sans" x="80" y="214" font-size="26" fill="#5b3a4a">Evaluation that is pre registered and honest.</text></g>
<g clip-path="url(#typed2)"><text class="sans" x="80" y="214" font-size="26" fill="#5b3a4a">Real, synthetic and proposed work, clearly labelled.</text></g>

  <text class="mono" x="80" y="250" font-size="15" fill="#a8788a" letter-spacing="1">DATA SCIENCE AND AI  /  AUTONOMY  /  UAE INFRASTRUCTURE</text>

  <!-- signal with a breathing uncertainty band -->
  <g stroke="#f7b6c8" stroke-width="1" opacity="0.7">
    <line x1="760" y1="100" x2="1112" y2="100" stroke-dasharray="2 6"/>
    <line x1="760" y1="150" x2="1112" y2="150" stroke-dasharray="2 6"/>
    <line x1="760" y1="200" x2="1112" y2="200" stroke-dasharray="2 6"/>
  </g>
  <rect class="scan" x="758" y="92" width="2" height="120" fill="#d9728f"/>
  <polygon class="band" points="760,162 805,130 850,178 895,106 940,159 985,92 1030,140 1075,108 1112,124 1112,172 1075,152 1030,180 985,128 940,191 895,134 850,202 805,150 760,178"
           fill="#f7b6c8" fill-opacity="0.45" stroke="#d9728f" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 4"/>
  <polyline class="draw" points="760,170 805,140 850,190 895,120 940,175 985,110 1030,160 1075,130 1112,148"
            fill="none" stroke="#d9728f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g class="pt" fill="#fffaf7" stroke="#d9728f" stroke-width="2.5"><circle cx="760" cy="170" r="4.5"/><circle cx="805" cy="140" r="4.5"/><circle cx="850" cy="190" r="4.5"/><circle cx="895" cy="120" r="4.5"/><circle cx="940" cy="175" r="4.5"/><circle cx="985" cy="110" r="4.5"/><circle cx="1030" cy="160" r="4.5"/><circle cx="1075" cy="130" r="4.5"/><circle cx="1112" cy="148" r="4.5"/></g>
  <!-- a glowing point that travels along the signal while it is drawn -->
  <g>
    <circle r="11" fill="#f7b6c8" class="glowpulse">
      <animateMotion dur="6s" repeatCount="indefinite" path="M760,170 L805,140 L850,190 L895,120 L940,175 L985,110 L1030,160 L1075,130 L1112,148" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear"/>
    </circle>
    <circle r="4.5" fill="#d9728f">
      <animateMotion dur="6s" repeatCount="indefinite" path="M760,170 L805,140 L850,190 L895,120 L940,175 L985,110 L1030,160 L1075,130 L1112,148" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.6;0.62;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text class="mono" x="760" y="250" font-size="14" fill="#a8788a">signal and uncertainty</text>
</svg>
